<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Canvas widget</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f1ea;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: #141414;
      }
      p {
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.75rem;
      }
      canvas {
        border: 1px solid #141414;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Webpack bundle · Canvas 2D</p>
      <canvas id="widget" width="480" height="160"></canvas>
    </main>
  </body>
</html>
